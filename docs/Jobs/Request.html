<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>fixora | Request Job</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/0/font-awesome/css/6.6.0/all.min.css">
  
</head>
<body>
  <header class="header">
    <h2>fixora</h2>
    <div class="search_content">
      <input type="search" placeholder="see providers near you">
      <button id="searchLocation">
        <i class="fa-solid fa-search"></i>
      </button>
    </div>
    <div class="location_content">
      <input type="list" placeholder="search for services">
      <button id="searchBtn">
        <i class="fa-solid fa-search"></i>
      </button>
    </div>
    <div class="messages">
      <i class="fa-solid fa-bell"></i>
      <span id="notifications">
        3
      </span>
      <img src="profile.jpg" alt="">
    </div>
  </header>
  <main class="main">
    <aside class="sidebar">
            <div class="bottom">
                <a href="index.html">
                    <i class="fa-solid fa-home"></i>
                </a>
                <p>home</p>
            </div>
            <div class="bottom">
                <a href="../Search/search.html">
                    <i class="fa-solid fa-search"></i>
                </a>
                <p>Search</p>
            </div>
            <div class="bottom">
                <a href="../Jobs/Myjob.html">
                    <i class="fa-solid fa-briefcase"></i>
                </a>
                <p>Jobs</p>
            </div>
            <div class="bottom">
                <a href="../Messages/Messages.html">
                    <i class="fa-solid fa-briefcase"></i>
                </a>
                <p>messages</p>
            </div>
            <div class="bottom">
                <a href="../Profile/Profile.html">
                    <i class="fa-solid fa-user"></i>
                </a>
                <p>profile</p>
            </div>
    </aside>
    <section class="right">

  <h3>Request a job</h3>
  
  <article class="card">
                    <div class="content">
                        <img src="profile.jpg" class="hero_img" alt="" />
                        <div class="floater">
                            <h3 id="title">james plumbing services</h3>
                            <div class="ratings">
                                <i class="fa-solid fa-star"></i
                                ><span id="reviews">4.9</span>
                            </div>
                            <div class="overlay">
                                <span id="county">Nairobi</span>
                                <p>kenya</p>
                            </div>
                            <div class="overlay">
                                <p>from ksh</p>
                                <span id="amount">300 +</span>
                            </div>
                        </div>
                    </div>
                    
                </article>

  <div class="containerB">
    <div class="article1">
      <p class="title2">service needed</p>
      <input type="list" placeholder="select service">
    </div>
    <div class="article2">
      
      <p class="title2">preffered date</p>
      <input type="date" placeholder="select date">
    </div>
    <div class="article3">
      
      <p class="title2">service budget</p>
      <input type="number" placeholder="select budget">
    </div>
  </div>
  <div class="description">
    <p class="title2">enter job description</p>
    <div class="descriptionSection">
    <textarea class="describe" placeholder="send message..."></textarea>
    
    <div class="uploads">
      <input type="file" multiple>
      <button class="upload_file">upload</button>
    </div>
  </div>
</div>
    
  <button id="send" class="send_request">send</button>
</section>
</main>
  <div class="home_bar">
            <div class="bottom">
                <a href="index.html">
                    <i class="fa-solid fa-home"></i>
                </a>
                <p>home</p>
            </div>
            <div class="bottom">
                <a href="../Search/search.html">
                    <i class="fa-solid fa-search"></i>
                </a>
                <p>Search</p>
            </div>
            <div class="bottom">
                <a href="../Jobs/Myjob.html">
                    <i class="fa-solid fa-briefcase"></i>
                </a>
                <p>Jobs</p>
            </div>
            <div class="bottom">
                <a href="../Messages/Messages.html">
                    <i class="fa-solid fa-briefcase"></i>
                </a>
                <p>messages</p>
            </div>
            <div class="bottom">
                <a href="../Profile/Profile.html">
                    <i class="fa-solid fa-user"></i>
                </a>
                <p>profile</p>
            </div>
        </div>
</body>
</html>
